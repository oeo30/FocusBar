name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          xcodebuild -project FocusBar.xcodeproj -scheme FocusBar -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION#v}" \
            build

      - name: Ad-hoc sign and zip
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd build/Build/Products/Release
          codesign --force --deep --sign - "FocusBar.app"
          ditto -c -k --keepParent "FocusBar.app" "FocusBar-${VERSION}.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/FocusBar-*.zip
          generate_release_notes: true
